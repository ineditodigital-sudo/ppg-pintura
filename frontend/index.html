<!doctype html>
<html lang="es-MX">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0078A9" />
    <meta
      name="description"
      content="Coating Systems Mx es una empresa mexicana dedicada a la aplicación y comercialización de recubrimientos industriales: pintura en polvo, pintura líquida y pre tratamientos metálicos."
    />

    <!-- La fuente se sirve desde este mismo dominio, así que no hay ningún
         `preconnect` a terceros que hacer. Se precarga sólo el peso 400: es
         el del cuerpo de texto y el primero que se necesita para pintar. -->
    <link
      rel="preload"
      href="/assets/fuentes/noto-sans-latin-400.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- El póster del vídeo del hero es el elemento LCP de la portada. -->
    <link
      rel="preload"
      href="/assets/video/hero-poster-2026-08.jpg"
      as="image"
      fetchpriority="high"
    />

    <!--
      Arranca el contenido antes que el bundle.

      El LCP estaba en 3,2 s con 2 s de «retraso en la renderización»: la
      cadena era HTML → bundle (849 ms) → /api/pages/home (1.147 ms) → pintar.
      Las peticiones no salían hasta que React arrancaba, así que los 343 KB de
      JavaScript se descargaban con la red ociosa.

      Esto las lanza al analizar el HTML, en paralelo con el bundle. No es
      `rel=preload as=fetch` porque la API no manda `Cache-Control` y la
      reutilización del precargado depende de que casen modo y credenciales;
      con la promesa en `window` no hay nada que casar. `lib/api.ts` la
      recoge si está, y si algo falla devuelve null y sigue el camino normal
      —incluida la copia local—, así que esto no puede romper la página.
    -->
    <script>
      window.__ppgContenido = {}
      for (const ruta of ['/api/site', '/api/navigation', '/api/pages/home']) {
        window.__ppgContenido[ruta] = fetch(ruta, {
          headers: { Accept: 'application/json' },
        })
          .then(function (r) {
            return r.ok ? r.json() : null
          })
          .catch(function () {
            return null
          })
      }
    </script>

    <title>Pintura en Polvo PPG | Distribuidor Autorizado en Aguascalientes</title>

    <!-- Ficha de la empresa para buscadores. Va en el HTML y no inyectada por
         JavaScript para que se lea aunque el rastreador no ejecute scripts. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Coating Systems Mx S de RL de CV",
        "alternateName": "Coating Systems MX",
        "description": "Distribuidor autorizado PPG. Pintura electrostática en polvo, aerosoles y marcadores de retoque en Aguascalientes, México.",
        "url": "https://ppg.pinturaenpolvo-mx.com",
        "logo": "https://ppg.pinturaenpolvo-mx.com/assets/marcas/ppg-azul.svg",
        "image": "https://ppg.pinturaenpolvo-mx.com/assets/csmx/aplicacion-polvo.jpg",
        "telephone": "+523333892775",
        "email": "ventas@coatingsystemsmx.com",
        "priceRange": "$$",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "República del Salvador, Col. Santa Elena",
          "postalCode": "20238",
          "addressLocality": "Aguascalientes",
          "addressRegion": "Aguascalientes",
          "addressCountry": "MX"
        },
        "areaServed": { "@type": "Country", "name": "México" },
        "sameAs": [
          "https://facebook.com/profile.php?id=100085940283950",
          "https://instagram.com/coatingsystemsmx",
          "https://linkedin.com/in/coatingsystemsmx"
        ],
        "makesOffer": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Pintura en polvo" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Pintura líquida" } },
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Pretratamientos metálicos" } }
        ]
      }
    </script>
    <!--
      Estilo de la pantalla de entrada, incrustado a propósito: si viniera en
      la hoja externa habría un instante con el velo sin estilar —una imagen
      suelta sobre fondo blanco— justo antes de que llegara el CSS.
    -->
    <style>
      .splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: linear-gradient(150deg, #252f3d, #181e28);
        /* Nunca intercepta clics, ni siquiera mientras se desvanece: por
           debajo la página ya es utilizable. */
        pointer-events: none;
        /* `forwards` deja fijado el estado final. Esta es la regla que
           garantiza que el velo se vaya sin intervención de JavaScript. */
        animation: splash-salir 1000ms ease forwards;
      }

      /* Remate azul de marca, el mismo de la cabecera. */
      .splash::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 4px;
        background: #0078a9;
      }

      .splash__logo {
        height: 68px;
        width: auto;
        opacity: 0;
        animation: splash-logo 620ms cubic-bezier(0.22, 1, 0.36, 1) forwards;
      }

      @keyframes splash-logo {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.96);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      @keyframes splash-salir {
        0%,
        62% {
          opacity: 1;
          visibility: visible;
        }
        100% {
          opacity: 0;
          visibility: hidden;
        }
      }

      /* Ya vista en esta sesión: no se vuelve a mostrar al navegar. */
      .splash--omitir {
        display: none;
      }

      /* Quien pide menos movimiento no ve ni el velo ni el logotipo entrando:
         una cortina a pantalla completa es exactamente lo que molesta. */
      @media (prefers-reduced-motion: reduce) {
        .splash {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <!--
      Pantalla de entrada.

      Va aquí y no en un componente de React por dos razones. Se ve desde el
      primer fotograma, sin esperar a los 344 KB del bundle —que es justo el
      hueco que tapa—. Y, más importante, **se quita sola con CSS**: la
      animación termina en `visibility: hidden` con `forwards`, así que si el
      JavaScript falla, tarda o está desactivado, el velo se va igual. Un velo
      a pantalla completa que dependa de JS para desaparecer es la forma más
      fácil de servir una página en blanco.

      El script de abajo sólo puede quitarlo ANTES; nunca mantenerlo.
    -->
    <div id="splash" class="splash" aria-hidden="true">
      <img
        class="splash__logo"
        src="/assets/marcas/ppg-blanco.svg"
        alt=""
        width="291"
        height="226"
      />
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <script>
      // Una sola vez por sesión: quien ya la vio no la vuelve a esperar al
      // navegar. Sólo acorta —marca el velo como terminado—; la regla de CSS
      // sigue siendo la que garantiza que se vaya en cualquier caso.
      try {
        if (sessionStorage.getItem('ppg-splash') === 'visto') {
          document.getElementById('splash').classList.add('splash--omitir')
        } else {
          sessionStorage.setItem('ppg-splash', 'visto')
        }
      } catch (e) {
        /* Sin sessionStorage (modo privado, cookies bloqueadas) se ve siempre. */
      }
    </script>
  </body>
</html>
